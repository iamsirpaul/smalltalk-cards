<title>Small Talk Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap">
<style>
/* Layout: one ruled index card centred on the page, flips from his sentence to the fix + rule.
   Palette and type from the Small Talk brand manual: blues + oranges, Montserrat only. */
:root{
  --desk:#EAF6FA; --card:#FFFFFF; --ink:#1C365F; --muted:#3F5F86;
  --rule:#D3ECF4; --margin:#EBA32B; --accent:#124380; --accent-ink:#FFFFFF;
  --good:#0F6FAC; --again:#E68A44; --again-ink:#FFFFFF; --warn:#EBA32B; --panel:#EAF6FA;
  --shadow:0 1px 2px rgba(28,54,95,.08),0 12px 30px rgba(28,54,95,.14);
  --display:"Montserrat","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Montserrat","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#1C365F; --card:#124380; --ink:#FFFFFF; --muted:#68C6DE;
  --rule:#245592; --margin:#EBA32B; --accent:#EBA32B; --accent-ink:#1C365F;
  --good:#68C6DE; --again:#E68A44; --again-ink:#FFFFFF; --warn:#EBA32B; --panel:#1C365F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#1C365F; --card:#124380; --ink:#FFFFFF; --muted:#68C6DE;
  --rule:#245592; --margin:#EBA32B; --accent:#EBA32B; --accent-ink:#1C365F;
  --good:#68C6DE; --again:#E68A44; --again-ink:#FFFFFF; --warn:#EBA32B; --panel:#1C365F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

.card{background:var(--card);border-radius:6px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 64px;min-height:380px;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;left:0;right:0;top:63px;height:2px;background:var(--margin);opacity:.7}
.card-top{height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--card)}
.tag{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.face{padding:20px 22px 22px;display:flex;flex-direction:column;gap:16px;flex:1}
.word{font-family:var(--display);font-weight:800;color:var(--ink);font-size:clamp(2.2rem,9vw,3.2rem);line-height:1.05;margin:8px 0 0;text-wrap:balance;letter-spacing:-.02em}
.word .vs{font-weight:600;color:var(--muted);font-size:.6em;padding:0 .2em}
.task{font-size:1.05rem;margin:0;background:var(--card);align-self:flex-start;padding:2px 0}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.starters li{background:var(--panel);border-radius:999px;padding:4px 12px;font-size:.92rem;font-style:italic}
.spacer{flex:1}

.pic{border-radius:4px;overflow:hidden;background:var(--panel);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .emo{font-size:clamp(3.5rem,16vw,5.5rem);line-height:1.1;text-align:center;letter-spacing:.08em}
.pic.short{aspect-ratio:auto;padding:22px 12px}
.explain{background:var(--card);border-radius:4px;display:flex;flex-direction:column;gap:12px}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:0 0 2px}
.def{margin:0;font-size:1.08rem}
.ex{margin:0;padding-left:14px;border-left:3px solid var(--rule);font-style:italic}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair>div{background:var(--panel);border-radius:4px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:6px}
.pair h3{font-family:var(--display);margin:0;font-size:1.25rem}
.pair p{margin:0;font-size:.95rem}
.trap{background:var(--panel);border-radius:4px;padding:10px 12px;font-size:.95rem;margin:0}
.trap b{color:var(--again)}
.trap .ok{color:var(--good);font-weight:700}
@media (max-width:420px){.pair{grid-template-columns:1fr}}

.actions{display:flex;gap:12px}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:14px 18px;cursor:pointer;flex:1;min-height:52px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink)}
.again{background:var(--again);color:var(--again-ink)}
.ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 2px var(--rule)}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:0}
.flip{animation:flip .35s ease}
@keyframes flip{from{transform:rotateX(70deg);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flip{animation:none}.bar span{transition:none}}
.done .word{font-size:2.4rem}
textarea{font:inherit;font-size:1rem;width:100%;box-sizing:border-box;min-height:110px;resize:vertical;border:2px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--card);color:var(--ink)}
textarea:focus-visible{outline:none;border-color:var(--accent)}
.fb{border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border-left:5px solid var(--muted)}
.fb.good{border-left-color:var(--good)} .fb.almost{border-left-color:var(--warn)} .fb.wrong{border-left-color:var(--again)}
.fb .verdict{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0}
.fb p{margin:0}
.fb .fix{font-style:italic}
.fb .src{font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.85rem;border-radius:999px;padding:2px 10px;background:var(--card)}
.chips .hit{color:var(--good);font-weight:700}
.chips .miss{color:var(--muted)}
.mine{background:var(--panel);border-radius:4px;padding:10px 12px;font-size:.95rem;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
</style><style>
.said{font-family:var(--display);font-weight:700;color:var(--ink);font-size:clamp(1.3rem,5.4vw,1.75rem);line-height:1.25;margin:8px 0 0;text-wrap:balance;background:var(--card)}
.said b{color:var(--again);font-weight:800;margin-right:.35em}
.lessons{font-size:.85rem;color:var(--muted);margin:0;background:var(--card);align-self:flex-start}
.right{font-family:var(--display);font-weight:800;color:var(--ink);font-size:clamp(1.3rem,5.4vw,1.7rem);line-height:1.25;margin:0;text-wrap:balance}
.right .ok{color:var(--good);margin-right:.35em}
.was{margin:0;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--again);font-size:.98rem}
.alt{margin:0;font-size:.92rem;color:var(--muted)}
.falsef{font-size:.92rem;margin:0;background:var(--panel);border-radius:999px;padding:4px 12px;align-self:flex-start}
.intro{margin:0;color:var(--muted);font-size:.92rem;text-align:center}
</style>

<div class="wrap notranslate" translate="no">
  <header>
    <h1>Small Talk Cards</h1>
    <span class="count" id="count"></span>
  </header>
  <div class="bar" aria-hidden="true"><span id="bar"></span></div>
  <p class="intro">Cards from our Small Talk calls, updated after every call. Every sentence on these cards was really said in a call.</p>
  <main id="stage" aria-live="polite"></main>
  <p class="hint" id="hint">Write your answer and tap “Check”. If it’s right, go to the next card. Stuck? Tap “Show me”.</p>
</div>

<script>
/* kind: fix = rewrite a real sentence from the call · pair = explain the difference · explain = explain a word from the call */
const CARDS = [
  {call:2, id:"graduated", kind:"fix", tag:"graduate",
   said:"My friend is graduated this morning.",
   right:"My friend graduated this morning.",
   rule:"Graduate is a normal verb: I graduated, she graduated in engineering. No “is”: “is graduated” is the Italian “si è laureato”.",
   need:[["graduated this morning"]], ban:["is graduated"]},
  {call:2, id:"comehome", kind:"fix", tag:"home",
   said:"So now I came back to home.",
   right:"So now I've come back home.",
   rule:"Home doesn't take “to” after go, come or get: go home, come back home, get home. But: at home (I'm at home).",
   need:[["back home"]], ban:["back to home"]},
  {call:2, id:"prefernot", kind:"fix", tag:"prefer not to",
   said:"I prefer don't work in the night hours.",
   right:"I prefer not to work at night.",
   rule:"Prefer + to + verb: I prefer to work near home. The negative is prefer NOT to. Never “prefer don't” or “prefer work”.",
   alt:"Also right: I'd rather not work at night.",
   need:[["prefer not to work","rather not work"]], ban:["prefer don't","prefer do not"]},
  {call:2, id:"dependson", kind:"fix", tag:"depends on",
   said:"It depends from, for example, if my company is near my home.",
   right:"It depends, for example, on whether my company is near my home.",
   rule:"Always depends on. Never from, of or about.",
   alt:"Also right: It depends on whether my company is near my home.",
   need:[["depends on","on whether","on if"]], ban:["depends from","depend from"]},
  {call:2, id:"late", kind:"fix", tag:"be late",
   said:"But I always late.",
   right:"But I'm always late.",
   rule:"Late is an adjective, so it needs be: I'm late, she's always late, we were late.",
   need:[["i'm always late","i am always late"]], ban:["i always late"]},
  {call:2, id:"makeyou", kind:"fix", tag:"make you",
   said:"A job that doesn't make your grow.",
   right:"A job that doesn't make you grow.",
   rule:"After make, use the person (me, you, him, her) + the base verb: it makes me laugh, it makes you grow. Your is for things: your job.",
   need:[["make you grow"]], ban:["make your grow"]},
  {call:2, id:"lowsalary", kind:"fix", tag:"low salary",
   said:"Another red flag is short salary.",
   right:"Another red flag is a low salary.",
   rule:"Salaries and prices are low or high, never short or long. A low salary, a high salary, a low price.",
   need:[["low salary"]], ban:["short salary"]},
  {call:2, id:"expect", kind:"pair", pair:["pretend","expect"], tag:"careful! false friend",
   starters:["Pretend means…","Expect means…"],
   a:{w:"pretend", d:"To act as if something is true when it isn't. In Italian: fare finta.", e:"He pretends to work when the boss walks by."},
   b:{w:"expect", d:"To think someone must do something, or that something will happen. In Italian: pretendere, aspettarsi.", e:"My boss expects me to answer emails on Sunday."},
   trap:["And also when they pretend that you have to work on the weekend.","And also when they expect you to work at the weekend."],
   keys:{need:2, all:true, ideas:[["act","fake","as if","not true","isn't true","finta","play"],["must","should","think","want","wait","aspett","pretend","demand","will happen","ask"]], names:["pretend = fare finta","expect = pretendere"]}},
  {call:2, id:"ride", kind:"pair", pair:["drive","ride"], tag:"careful! two different verbs",
   starters:["You drive…","You ride…"],
   a:{w:"drive", d:"To control a car, a van or a bus. In Italian: guidare (la macchina).", e:"I got my driving licence at 25, but I don't drive much."},
   b:{w:"ride", d:"To sit on and control a motorbike, a bike or a horse. In Italian: andare in moto, in bici, a cavallo.", e:"I don't ride a motorbike."},
   trap:["I drive motorcycle.","I ride a motorbike."],
   keys:{need:2, all:true, ideas:[["car","van","bus","truck","guid"],["motorbike","motorcycle","bike","bicycle","horse","moto","scooter"]], names:["drive = a car","ride = a motorbike or a bike"]}},
  {call:2, id:"canteen", kind:"explain", word:"a canteen", tag:"careful! false friend",
   starters:["A canteen is…","In my office…"],
   def:"The place at work or at school where you can eat, sometimes for free or with a discount. In Italian: la mensa. A cantina is a cellar.",
   ex:["Some offices have a canteen with pasta every day.","A free lunch in the canteen is a nice feature in a job."],
   keys:{need:2, ideas:[["eat","food","lunch","meal","pasta"],["work","office","school","company","university"],["mensa","free","discount","cheap"]]}, names:["food","at work or school","mensa"]},
  {call:2, id:"commute", kind:"explain", word:"a commute", tag:"from the call",
   starters:["Your commute is…","My commute…"],
   def:"The trip you make every day from home to work and back. A commuter is a person who does it (il pendolare).",
   ex:["I prefer a short commute, so I can work near home.","My sister's commute in Milan is very long."],
   keys:{need:2, ideas:[["trip","journey","travel","go","drive","train"],["home","house"],["work","office","job"],["every day","daily","pendolar","back"]]}, names:["the trip","from home","to work","every day"]},
  {call:2, id:"businesstrip", kind:"explain", word:"a business trip", tag:"you said the work traveling",
   youSaid:"the work traveling",
   starters:["A business trip is…","Last year…"],
   def:"A trip you make for your job, to see clients or go to another office. In Italian: la trasferta, il viaggio di lavoro.",
   ex:["They didn't pay for our business trips.","I'm going on a business trip to Germany next week."],
   keys:{need:2, ideas:[["trip","travel","journey","go","viaggio"],["work","job","company","client","office","meeting"],["trasfert","pay","hotel","another city"]]}, names:["a trip","for work","trasferta"]},
  {call:2, id:"followthrough", kind:"explain", word:"to follow through", tag:"from the call",
   starters:["To follow through means…","Some people propose things but…"],
   def:"To finish something you proposed or started, instead of leaving it to other people. In Italian: portare a termine, andare fino in fondo.",
   ex:["I don't like people who propose things and don't follow through.","She always follows through on her ideas."],
   keys:{need:2, ideas:[["finish","complete","end","until","fino in fondo","termine"],["propose","start","idea","promise","project","task"],["not leave","yourself","responsib","don't delegate","don't disappear"]]}, names:["finish it","what you proposed","don't leave it to others"]},
  {call:1, id:"agree", kind:"fix", tag:"agree",
   said:"I'm agree with the other people.",
   right:"I agree with the other people.",
   rule:"Agree is a verb, not an adjective: I agree, I don't agree, I disagree. Never “I'm agree”.",
   need:[["i agree"]], ban:["i'm agree","i am agree"]},
  {call:1, id:"towrite", kind:"fix", tag:"for / to",
   said:"I use AI for write emails.",
   right:"I use AI to write emails.",
   rule:"To say why you use something: to + verb (to write), or for + -ing (for writing). Never for + the base verb.",
   alt:"Also right: I use AI for writing emails.",
   need:[["to write","for writing"]], ban:["for write "]},
  {call:1, id:"speak", kind:"fix", tag:"speak / talk",
   said:"It's important to talk English.",
   right:"It's important to speak English.",
   rule:"Languages go with speak: speak English, speak Italian. Talk is for a conversation: talk to someone, talk about something.",
   need:[["speak english"]], ban:["talk english"]},
  {call:1, id:"older", kind:"fix", tag:"bigger / older",
   said:"I'm eight years bigger than my brother.",
   right:"I'm eight years older than my brother.",
   rule:"For age, use old: older, the oldest, my older brother. Bigger is for size.",
   alt:"Also right: My brother is eight years younger than me.",
   need:[["older","younger"]], ban:["bigger"]},
  {call:1, id:"jumped", kind:"fix", tag:"past tense",
   said:"When I was younger, a cat jump on my face.",
   right:"When I was younger, a cat jumped on my face.",
   rule:"A story in the past stays in the past: jumped, stayed, waited. Don't slip back to the present.",
   need:[["jumped"]], ban:["jump on","jumps on"]},
  {call:1, id:"stayed", kind:"fix", tag:"past tense",
   said:"In 2024 I stay in Berlin for six months.",
   right:"In 2024 I stayed in Berlin for six months.",
   rule:"Finished time in the past (in 2024, last year): past simple. Stayed, not stay.",
   alt:"Also right: In 2024 I spent six months in Berlin.",
   need:[["stayed","spent","lived"]], ban:["i stay "]},
  {call:2, id:"has", kind:"fix", tag:"he / she / it",
   said:"She have a research to do.",
   right:"She has some research to do.",
   rule:"He, she, it: has, not have. And research is uncountable: some research, not “a research”.",
   alt:"Same mistake in call 2: “he don't pay the right salary” → he doesn't pay, “my job make me work at home” → my job makes me.",
   need:[["she has"]], ban:["she have"]},
  {call:1, id:"are", kind:"fix", tag:"is / are",
   said:"There are many languages that is not English.",
   right:"There are many languages that are not English.",
   rule:"Languages is plural, so the verb is plural too: languages that are, people who are.",
   need:[["that are not","that aren't","which are not","which aren't"]], ban:["that is not","which is not","that isn't"]},
  {call:1, id:"notto", kind:"fix", tag:"not to",
   said:"It's very easy to don't like them.",
   right:"It's very easy not to like them.",
   rule:"The negative of “to like” is “not to like”. Don't only goes with a subject: I don't like them.",
   need:[["not to like"]], ban:["to don't","to do not"]},
  {call:1, id:"it", kind:"fix", tag:"he / she / it",
   said:"I talk with her about my ideas. (her = the AI)",
   right:"I talk with it about my ideas.",
   rule:"Things, apps and AI are “it”, not he or she. Italian uses lui or lei, English doesn't.",
   need:[["with it"]], ban:["with her","with him"]},
  {call:1, id:"better", kind:"fix", tag:"opposites",
   said:"I don't know if the future will be worse or bad.",
   right:"I don't know if the future will be worse or better.",
   rule:"Pairs go together: better or worse, good or bad. Don't mix a comparative with a normal adjective.",
   need:[["worse or better","better or worse"]], ban:["or bad"]},
  {call:1, id:"feel", kind:"fix", tag:"feel",
   said:"I have to feel me normal.",
   right:"I need to feel normal.",
   rule:"In English feel is not reflexive: I feel good, I feel normal. Never “feel me”.",
   need:[["feel normal"]], ban:["feel me"]},
  {call:1, id:"spend", kind:"pair", pair:["stay","spend"], tag:"careful! two different verbs",
   starters:["You stay…","You spend…"],
   a:{w:"stay", d:"To remain in a place for some time: stay in Berlin, stay at a hotel, stay at home.", e:"I stayed in Berlin for six months."},
   b:{w:"spend", d:"To use time (or money): spend six months, spend the weekend, spend 23 euros.", e:"I spent six months in Berlin."},
   trap:["I passed six months in Berlin.","I spent six months in Berlin."],
   keys:{need:2, all:true, ideas:[["place","remain","hotel","home","city","somewhere","in a"],["time","money","months","weekend","days","euro","use"]], names:["stay = a place","spend = time or money"]}},
  {call:1, id:"siblings", kind:"explain", word:"siblings", tag:"from the call",
   starters:["Siblings are…","I have…"],
   def:"Your brothers and sisters. In Italian: fratelli (boys and girls together).",
   ex:["Do you have any siblings?","I have four siblings and I'm in the middle."],
   keys:{need:1, ideas:[["brother","sister"],["fratell","sorell"],["family","parents"]]}, names:["brothers and sisters","fratelli","family"]},
  {call:1, id:"granted", kind:"explain", word:"to take something for granted", tag:"from the call",
   starters:["It's when you think…","For example…"],
   def:"To think something is normal and will always be there, so you don't appreciate it. In Italian: dare per scontato.",
   ex:["We shouldn't take English for granted.","Don't take your health for granted."],
   keys:{need:1, ideas:[["normal","obvious","always there","sure","scontato","assume","expect"],["appreciate","value","grateful","thank"]]}, names:["think it's normal","don't appreciate it"]},
  {call:1, id:"jobforlife", kind:"explain", word:"a job for life", tag:"from the call",
   starters:["It's a job that…","In Italian…"],
   def:"A permanent job that you can keep until you retire. In Italian: il posto fisso.",
   ex:["He won a public competition and now he has a job for life.","My parents wanted me to find a job for life."],
   keys:{need:1, ideas:[["permanent","forever","always","until you retire","retire","whole life","never lose","safe","secure"],["posto fisso","fisso","public","concorso"]]}, names:["permanent","posto fisso"]},
  {call:1, id:"tokens", kind:"explain", word:"to run out of something", tag:"from the call",
   starters:["It means you…","I ran out of…"],
   def:"To use all of something, so you don't have any left. You can run out of tokens, time, money, milk.",
   ex:["Sometimes I run out of tokens with Claude.","We ran out of time, so we stopped the game."],
   keys:{need:1, ideas:[["finish","no more","nothing left","use all","used all","don't have any","empty","esaurire","finire"]]}, names:["you have no more"]}
];

const $ = s => document.querySelector(s);
const stage = $("#stage");
let queue = [], total = 0, done = 0, missed = new Set(), revealed = false, answer = "";

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function lessonsText(c){return c.kind==="fix" ? `Someone said this in call ${c.call}` : `From call ${c.call}`}
function label(c){return c.kind==="pair" ? c.pair.join(" / ") : c.kind==="explain" ? c.word : c.tag}

function start(ids){
  const pool = ids ? CARDS.filter(c=>ids.includes(c.id)) : CARDS.slice();
  queue = shuffle(pool); total = pool.length; done = 0; missed = new Set();
  render();
}

function norm(t){return " " + t.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9àèéìòù' ]+/g," ").replace(/\s+/g," ") + " "}
const ITALIAN = [" il "," lo "," gli "," che "," è "," una "," per "," non "," sono "," della "," quando "," cosa "," perché "," questo "];

function quickCheck(c, text){
  const t = norm(text);
  if(ITALIAN.filter(w=>t.includes(w)).length >= 3) return {verdict:"wrong", feedback:"This looks like Italian! Try again in English."};
  if(c.kind==="fix"){
    const bad = c.ban.filter(b=>t.includes(" "+b));
    const hits = c.need.map(g=>g.some(w=>t.includes(w)));
    if(bad.length) return {verdict:"wrong", feedback:`The old mistake is still there: “${bad[0]}”. Try again.`};
    if(hits.every(Boolean)) return {verdict:"good", feedback:"Yes! That's the right form."};
    return {verdict:"almost", feedback: hits.some(Boolean) ? "Getting there. One part still isn't right." : "Not yet. Look at the tag on the card: that's where the mistake is."};
  }
  const k = c.keys, names = c.names || k.names;
  const hits = k.ideas.map(g=>g.some(w=>t.includes(w)));
  const n = hits.filter(Boolean).length;
  const ok = k.all ? hits.every(Boolean) : n >= k.need;
  return {verdict: ok?"good":n?"almost":"wrong",
    feedback: ok ? "Great, you got the key ideas!" : n ? (k.all ? "Good start! Now explain the other word too." : "You're close. Add one more detail.") : "I can't find the key ideas. Try an example from your life.",
    chips: names.map((name,i)=>({name, hit:hits[i]}))};
}

const VERDICT = {good:"✓ Yes, that's it!", almost:"≈ Almost there", wrong:"✗ Not quite"};
function feedbackHTML(r){
  return `<div class="fb ${r.verdict}">
    <p class="verdict">${VERDICT[r.verdict]}</p>
    <p>${esc(r.feedback)}</p>
    ${r.corrected?`<p class="fix">Better: ${esc(r.corrected)}</p>`:""}
    ${r.chips?`<div class="chips">${r.chips.map(x=>`<span class="${x.hit?"hit":"miss"}">${x.hit?"✓":"○"} ${esc(x.name)}</span>`).join("")}</div>`:""}
    
  </div>`;
}

async function check(){
  const c = queue[0], box = $("#answer"), btn = $("#check"), out = $("#feedback");
  const text = box.value.trim();
  if(text.split(/\s+/).length < 2){ out.innerHTML = feedbackHTML({verdict:"almost", feedback:"Write a full sentence first."}); return; }
  answer = text; btn.disabled = true; btn.textContent = "Checking…";
  const r = quickCheck(c, text);
  if(queue[0] !== c) return;
  out.innerHTML = feedbackHTML(r);
  if(r.verdict === "good"){
    // Right answer: offer the next card instead of the flip
    stage.querySelector(".actions").innerHTML =
      `<button class="ghost" id="show">Show me</button><button class="primary" id="next">Next card</button>`;
    $("#show").onclick = ()=>{ answer = text; reveal(); };
    $("#next").onclick = ()=>{ queue.shift(); done++; render(); window.scrollTo({top:0}); };
    $("#next").focus();
    return;
  }
  btn.disabled = false; btn.textContent = "Check again";
  $("#show").className = r.verdict === "good" ? "primary" : "ghost";
  btn.className = r.verdict === "good" ? "ghost" : "primary";
}

function front(c){
  let head;
  if(c.kind==="fix"){
    head = `<p class="said"><b>✗</b>“${esc(c.said)}”</p>
      <p class="lessons">${lessonsText(c)}.</p>
      <p class="task">Write it the right way.</p>`;
  } else if(c.kind==="pair"){
    head = `<h2 class="word">${esc(c.pair[0])}<span class="vs">or</span>${esc(c.pair[1])}</h2>
      <p class="task">What's the difference? Explain it in English.</p>
      <ul class="starters">${c.starters.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
  } else {
    head = `<h2 class="word" style="font-size:clamp(1.8rem,7.5vw,2.6rem)">${esc(c.word)}</h2>
      ${c.youSaid?`<p class="falsef">You used to say: <i>${esc(c.youSaid)}</i></p>`:""}
      <p class="task">Explain it in English.</p>
      <ul class="starters">${c.starters.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
  }
  return `<div class="face">${head}
    <label for="answer" class="label">Your answer</label>
    <textarea id="answer" placeholder="Write in English…" autocomplete="off" spellcheck="false"></textarea>
    <div id="feedback" aria-live="polite"></div>
  </div>`;
}

function back(c){
  const mine = answer ? `<div><p class="label">You wrote</p><p class="mine">${esc(answer)}</p></div>` : "";
  let body;
  if(c.kind==="fix"){
    body = `<p class="was">${esc(c.said)}</p>
      <p class="right"><span class="ok">✓</span>${esc(c.right)}</p>
      ${mine}
      <div><p class="label">The rule</p><p class="def">${esc(c.rule)}</p></div>
      ${c.alt?`<p class="alt">${esc(c.alt)}</p>`:""}
      <p class="lessons">${lessonsText(c)}.</p>`;
  } else if(c.kind==="pair"){
    const box = x=>`<div><h3>${esc(x.w)}</h3><p>${esc(x.d)}</p><p class="ex">${esc(x.e)}</p></div>`;
    body = `${mine}<div class="pair">${box(c.a)}${box(c.b)}</div>
      <p class="trap"><b>✗</b> ${esc(c.trap[0])}<br><span class="ok">✓</span> ${esc(c.trap[1])}</p>
      <p class="lessons">${lessonsText(c)}.</p>`;
  } else {
    body = `${mine}<div><p class="label">One way to explain it</p><p class="def">${esc(c.def)}</p></div>
      <div><p class="label">Examples</p>${c.ex.map(e=>`<p class="ex">${esc(e)}</p>`).join("")}</div>
      <p class="lessons">${lessonsText(c)}.</p>`;
  }
  return `<div class="face"><div class="explain">${body}</div></div>`;
}

function render(){
  $("#count").textContent = queue.length ? `${done} / ${total} done` : "";
  $("#bar").style.width = (total? done/total*100 : 0) + "%";
  if(!queue.length) return finish();
  const c = queue[0]; revealed = false; answer = "";
  const kindName = {fix:"Fix it", pair:"Which one?", explain:"Explain it"}[c.kind];
  stage.innerHTML = `<article class="card flip">
      <div class="card-top"><span class="tag">${kindName} · ${esc(c.tag)}</span><span class="tag">${queue.length} left</span></div>
      ${front(c)}
    </article>
    <div class="actions" style="margin-top:16px"><button class="ghost" id="show">Show me</button><button class="primary" id="check">Check</button></div>`;
  $("#hint").hidden = false;
  $("#show").onclick = ()=>{ answer = $("#answer").value.trim(); reveal(); };
  $("#check").onclick = check;
}

function reveal(){
  const c = queue[0]; revealed = true;
  const card = stage.querySelector(".card");
  card.classList.remove("flip"); void card.offsetWidth; card.classList.add("flip");
  card.innerHTML = `<div class="card-top"><span class="tag">${esc(label(c))}</span><span class="tag">Compare with yours</span></div>${back(c)}`;
  stage.querySelector(".actions").innerHTML =
    `<button class="again" id="again">Not yet, again</button><button class="primary" id="got">Yes, I got it</button>`;
  $("#hint").hidden = true;
  $("#got").onclick = ()=>{queue.shift(); done++; render(); window.scrollTo({top:0})};
  $("#again").onclick = ()=>{const x=queue.shift(); missed.add(x.id); queue.splice(Math.min(2,queue.length),0,x); render(); window.scrollTo({top:0})};
}

function finish(){
  const tricky = [...missed];
  $("#hint").hidden = true;
  stage.innerHTML = `<article class="card done flip"><div class="card-top"><span class="tag">finished</span></div>
    <div class="face"><h2 class="word">Well done!</h2>
    <p class="task">You went through all ${total} cards.</p>
    ${tricky.length?`<p class="def">Still tricky today: <b>${tricky.map(id=>esc(label(CARDS.find(x=>x.id===id)))).join(", ")}</b>.</p>`:`<p class="def">No repeats at all. Perfect round!</p>`}
    <div class="spacer"></div></div></article>
    <div class="actions" style="margin-top:16px">
      ${tricky.length?`<button class="primary" id="tricky">Practise the tricky ones</button>`:""}
      <button class="${tricky.length?"ghost":"primary"}" id="all">Start again</button>
    </div>`;
  $("#all").onclick = ()=>start();
  if(tricky.length) $("#tricky").onclick = ()=>start(tricky);
}

document.addEventListener("keydown",e=>{
  if(["BUTTON","TEXTAREA"].includes(e.target.tagName)) return;
  if(e.key===" "||e.key==="Enter"){ if(!revealed && queue.length){e.preventDefault();answer="";reveal()} }
});

start();
</script>
